# Two containers from one image: the web app and the background worker (OCR, inbox scan, backups).
# Setup:  cp .env.example .env   (edit NAS_PATH etc.)   then   docker compose up -d --build

x-common: &common
  build: .
  image: steuer-hub:latest
  restart: unless-stopped
  user: "${PUID:-1000}:${PGID:-1000}"
  env_file: .env
  environment:
    STEUER_DATA_DIR: /data
    STEUER_NAS_ROOT: /nas
    STEUER_CONFIG_DIR: /srv/app/config
  volumes:
    - ./data:/data                    # SQLite DB: keep on LOCAL disk (SSD), never on the NAS share
    - ${NAS_PATH}:/nas                # receipts live here
    - ./config:/srv/app/config:ro     # categories.yml, tax_rules.yml

services:
  web:
    <<: *common
    ports:
      - "${STEUER_PORT:-8080}:8080"   # LAN only. Put Caddy/TLS in front (see Caddyfile.example) for HTTPS.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  worker:
    <<: *common
    command: ["python", "-m", "worker.run"]
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/worker_heartbeat')<300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
